[package]
name = "agent-usage-tracker"
version = "0.4.0"
description = "Agent usage tracker"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_usage_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "charset", "http2", "form"] }
tokio = { version = "1.53.1", features = ["time", "sync", "macros"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
window-vibrancy = "0.8.1"
tauri-plugin-autostart = "2.7.0"
base64 = "0.23.1"
dirs = "7.0.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
