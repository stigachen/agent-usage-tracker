name: Grok renewal validation (research only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe native CLI with synthetic credentials and loopback OAuth
        run: python scripts/probe-grok-renewal.py --method models --output results/${{ runner.os }}.json
      - name: Upload nonsecret observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grok-renewal-probe-${{ runner.os }}
          path: results/*.json
          if-no-files-found: warn
