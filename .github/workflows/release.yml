# Builds a signed + notarized universal macOS dmg and an unsigned Windows x64 portable ZIP.
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    outputs:
      release_id: ${{ steps.release.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v__VERSION__-{0}', github.run_number) }}
          releaseName: Agent Usage v__VERSION__
          releaseDraft: true
          args: --target universal-apple-darwin --bundles app,dmg

      # tauri-action notarizes the .app but not the dmg wrapping it.
      - name: Notarize and staple dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.releaseId }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .tag_name)
          # tauri-action uploads with dots for spaces in the asset name.
          cp "$DMG" "$(basename "$DMG" | tr ' ' '.')"
          gh release upload "$TAG" "$(basename "$DMG" | tr ' ' '.')" --clobber

  windows:
    # Reuse the exact draft created above; two builders must not race to create it.
    needs: macos
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Windows executable
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Package portable Windows app
        id: portable
        shell: pwsh
        run: ./scripts/package-windows.ps1

      - name: Upload portable ZIP to the macOS draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.macos.outputs.release_id }}
          PORTABLE_ARCHIVE: ${{ steps.portable.outputs.archive }}
        run: |
          $tag = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" --jq .tag_name
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload "$tag" "$env:PORTABLE_ARCHIVE" --clobber
